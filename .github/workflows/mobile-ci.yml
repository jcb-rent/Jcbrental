name: Mobile foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate ${{ matrix.app }} app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, operations]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check Expo dependency compatibility
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec expo install --check
      - name: TypeScript check
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec tsc --noEmit
      - name: Android JavaScript bundle export
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec expo export --platform android
