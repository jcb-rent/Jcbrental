name: PWA foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    name: Validate PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check and production build
        run: pnpm build
      - name: Verify PWA output
        run: test -f apps/web/dist/manifest.webmanifest && test -f apps/web/dist/sw.js && test -f apps/web/dist/index.html
