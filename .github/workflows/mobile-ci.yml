name: PWA foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    name: Validate PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check and production build
        run: pnpm build
      - name: Verify PWA integration outputs
        run: node scripts/verify-pwa.mjs
      - name: Verify security regression controls
        run: node scripts/verify-security.mjs
